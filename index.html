<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Does It Swing? Slider</title>
<link href="https://fonts.googleapis.com/css?family=Raleway:400,700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f8f9fa; --fg:#212529; --card:#fff; --line:#dee2e6; --accent:#17a2b8; --danger:#dc3545; --ok:#28a745; --muted:#6c757d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181b; --fg:#e9ecef; --card:#212529; --line:#343a40; --muted:#9aa3ab; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:Raleway,system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  nav { background:var(--card); border-bottom:1px solid var(--line); padding:.8rem 1rem; display:flex; justify-content:space-between; align-items:center; }
  nav b { font-size:1.25rem; }
  nav button { background:none; border:0; color:var(--accent); font:inherit; cursor:pointer; }
  main { max-width:720px; margin:0 auto; padding:1rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:1rem; margin-bottom:1rem; }
  .row { display:flex; gap:.5rem; flex-wrap:wrap; }
  .row > * { flex:1 1 140px; }
  input[type=text] { flex:3 1 200px; padding:.5rem; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--fg); font:inherit; }
  button.btn { padding:.7rem; border:0; border-radius:4px; font:inherit; font-weight:700; color:#fff; cursor:pointer; }
  button.btn:disabled { opacity:.45; cursor:not-allowed; }
  .start { background:var(--ok); } .stop, .reset { background:var(--danger); } .chart { background:var(--accent); } .set { background:#007bff; }
  .big { font-size:4rem; font-weight:700; text-align:center; line-height:1; margin:.5rem 0; font-variant-numeric:tabular-nums; }
  .timer { text-align:center; color:var(--muted); margin-bottom:1rem; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; height:44px; accent-color:var(--accent); cursor:pointer; }
  .scale { display:flex; justify-content:space-between; color:var(--muted); font-size:.85rem; }
  .status { text-align:center; font-weight:700; margin-bottom:.5rem; }
  .rec { color:var(--danger); } .rec::before { content:"● "; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  h2 { margin:.2rem 0 1rem; font-size:1.3rem; }
  .hist-item { display:flex; justify-content:space-between; align-items:center; padding:.5rem 0; border-top:1px solid var(--line); gap:.5rem; }
  .hist-item:first-of-type { border-top:0; }
  .hist-item small { color:var(--muted); display:block; }
  .hist-item button { background:none; border:0; color:var(--accent); cursor:pointer; font:inherit; }
  .hist-item button.del { color:var(--danger); }
  dialog { border:0; border-radius:8px; padding:0; width:min(960px,96vw); background:var(--card); color:var(--fg); }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  .mh { display:flex; justify-content:space-between; padding:1rem; border-bottom:1px solid var(--line); font-weight:700; }
  .mh button { background:none; border:0; font-size:1.5rem; color:var(--fg); cursor:pointer; line-height:1; }
  .mb { padding:1rem; }
  svg { width:100%; height:auto; display:block; }
  svg text { fill:var(--muted); font-size:12px; }
  .tip { color:var(--muted); font-size:.9rem; margin-top:.5rem; }
  /* Mobile: vertical slider (100% at top, 0% at bottom) */
  .end { display:none; }
  @media (max-width: 600px) {
    .end { display:block; text-align:center; font-weight:700; font-size:1.2rem; letter-spacing:.02em; margin:.6rem 0; }
    .end.top { color:var(--ok); } .end.bottom { color:var(--danger); }
    .sl { --h:max(240px, min(48vh, 380px)); --t:112px; --th:26px; display:flex; justify-content:center; align-items:flex-start; gap:1rem; height:var(--h); }
    /* rotation: works in all mobile browsers; the track is a thick pill filled up to the thumb */
    input[type=range] { -webkit-appearance:none; appearance:none; background:transparent; flex:none; width:var(--h); height:var(--t); margin:0 calc(var(--t) - var(--h)) 0 0; transform:translateY(var(--h)) rotate(-90deg); transform-origin:top left; touch-action:none; }
    input[type=range]::-webkit-slider-runnable-track { height:var(--t); border-radius:var(--t); background:linear-gradient(90deg,#0e7f90,var(--accent)) left/calc((100% - var(--th)) * var(--p,0) + var(--th) / 2) 100% no-repeat, var(--line); }
    input[type=range]::-moz-range-track { height:var(--t); border-radius:var(--t); background:linear-gradient(90deg,#0e7f90,var(--accent)) left/calc((100% - var(--th)) * var(--p,0) + var(--th) / 2) 100% no-repeat, var(--line); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:var(--th); height:calc(var(--t) + 14px); margin-top:-7px; border-radius:14px; background:#fff; border:3px solid var(--accent); box-shadow:0 2px 8px rgba(0,0,0,.3); }
    input[type=range]::-moz-range-thumb { width:calc(var(--th) - 6px); height:calc(var(--t) + 8px); border-radius:14px; background:#fff; border:3px solid var(--accent); box-shadow:0 2px 8px rgba(0,0,0,.3); }
    .scale { flex-direction:column-reverse; height:100%; }
  }
</style>
</head>
<body>
<nav><b>Does It Swing?</b><button id="histBtn">History</button></nav>
<main>
  <div class="card" id="recorder">
    <div class="row" style="margin-bottom:1rem">
      <input type="text" id="name" placeholder="Recording name" aria-label="Recording name">
      <button class="btn set" id="setName">Set name</button>
    </div>
    <div class="status" id="status">Ready</div>
    <div class="big"><span id="val">0</span>%</div>
    <div class="timer" id="timer">00:00.0</div>
    <div class="end top">It swings</div>
    <div class="sl">
      <input type="range" id="slider" min="0" max="100" step="1" value="0" aria-label="Percentage">
      <div class="scale"><span>0%</span><span>50%</span><span>100%</span></div>
    </div>
    <div class="end bottom">It doesn't swing</div>
    <div class="row" style="margin-top:1rem">
      <button class="btn start" id="start">Start</button>
      <button class="btn stop" id="stop" disabled>Stop</button>
      <button class="btn reset" id="reset" disabled>Reset</button>
      <button class="btn chart" id="chart" disabled>Show chart</button>
    </div>
    <div class="tip">While recording, move the slider: the value is sampled 10 times per second.</div>
  </div>
  <div class="card" id="history" hidden><h2>History</h2><div id="histList"></div></div>
</main>

<dialog id="modal">
  <div class="mh"><span id="mtitle">Chart</span><button id="mclose" aria-label="Close">×</button></div>
  <div class="mb"><div id="plot"></div></div>
</dialog>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = "swing-slider-history";
  let state = "idle";           // idle | recording | stopped
  let samples = [];             // [{t: ms, v: 0..100}]
  let t0 = 0, tick = null, name = "";

  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
  const save = list => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch {} };
  const fmt = ms => { const s = ms / 1000; return String(Math.floor(s / 60)).padStart(2, "0") + ":" + (s % 60).toFixed(1).padStart(4, "0"); };

  function ui() {
    const rec = state === "recording";
    $("start").disabled = rec;
    $("stop").disabled = !rec;
    $("reset").disabled = state !== "stopped";
    $("chart").disabled = state !== "stopped" || samples.length < 2;
    $("status").className = "status" + (rec ? " rec" : "");
    $("status").textContent = rec ? "Recording" : state === "stopped" ? "Stopped" : "Ready";
  }

  function sample() {
    const t = performance.now() - t0;
    samples.push({ t: Math.round(t), v: +$("slider").value });
    $("timer").textContent = fmt(t);
  }

  const paint = () => { $("val").textContent = $("slider").value; $("slider").style.setProperty("--p", $("slider").value / 100); };
  $("slider").addEventListener("input", paint); paint();

  $("start").onclick = () => {
    samples = []; t0 = performance.now(); state = "recording";
    sample(); tick = setInterval(sample, 100); ui();
  };
  $("stop").onclick = () => {
    clearInterval(tick); sample(); state = "stopped";
    const list = load();
    name = $("name").value.trim() || "Untitled";
    list.unshift({ id: Date.now(), name, date: new Date().toISOString(), samples });
    save(list.slice(0, 50)); renderHistory(); ui();
  };
  $("reset").onclick = () => {
    samples = []; state = "idle"; $("timer").textContent = "00:00.0"; ui();
  };
  $("setName").onclick = () => { name = $("name").value.trim(); $("name").blur(); };

  // --- Chart (SVG, step plot) ---
  function plot(data, title) {
    const W = 900, H = 420, m = { l: 48, r: 16, t: 16, b: 36 };
    const tMax = Math.max(data[data.length - 1].t, 1);
    const x = t => m.l + (t / tMax) * (W - m.l - m.r);
    const y = v => H - m.b - (v / 100) * (H - m.t - m.b);
    let g = "";
    for (let v = 0; v <= 100; v += 20)
      g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity=".12"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${v}%</text>`;
    const n = 6;
    for (let i = 0; i <= n; i++) {
      const t = (tMax * i) / n;
      g += `<text x="${x(t)}" y="${H - 12}" text-anchor="middle">${(t / 1000).toFixed(1)} s</text>`;
    }
    const pts = data.map(s => `${x(s.t).toFixed(1)},${y(s.v).toFixed(1)}`).join(" ");
    const area = `${x(0)},${y(0)} ${pts} ${x(data[data.length - 1].t)},${y(0)}`;
    $("mtitle").textContent = "Chart: " + title;
    $("plot").innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Percentage over time">${g}
       <polygon points="${area}" fill="#17a2b8" opacity=".15"/>
       <polyline points="${pts}" fill="none" stroke="#17a2b8" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
    $("modal").showModal();
  }
  $("chart").onclick = () => plot(samples, name || $("name").value.trim() || "Untitled");
  $("mclose").onclick = () => $("modal").close();
  $("modal").addEventListener("click", e => { if (e.target === $("modal")) $("modal").close(); });

  // --- History ---
  function renderHistory() {
    const list = load(), box = $("histList");
    box.textContent = "";
    if (!list.length) { box.textContent = "No recordings."; return; }
    for (const r of list) {
      const dur = r.samples.length ? fmt(r.samples[r.samples.length - 1].t) : "00:00.0";
      const avg = r.samples.length ? Math.round(r.samples.reduce((a, s) => a + s.v, 0) / r.samples.length) : 0;
      const row = document.createElement("div"); row.className = "hist-item";
      const info = document.createElement("div");
      const b = document.createElement("b"); b.textContent = r.name;
      const sm = document.createElement("small");
      sm.textContent = `${new Date(r.date).toLocaleString("en-US")} · ${dur} · average ${avg}%`;
      info.append(b, sm);
      const acts = document.createElement("div");
      const show = document.createElement("button"); show.textContent = "Chart";
      show.onclick = () => r.samples.length > 1 && plot(r.samples, r.name);
      const del = document.createElement("button"); del.textContent = "Delete"; del.className = "del";
      del.onclick = () => { save(load().filter(x => x.id !== r.id)); renderHistory(); };
      acts.append(show, del); row.append(info, acts); box.append(row);
    }
  }
  $("histBtn").onclick = () => { const h = $("history"); h.hidden = !h.hidden; if (!h.hidden) renderHistory(); };

  ui();
})();
</script>
</body>
</html>
